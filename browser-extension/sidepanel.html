<!doctype html>
<html lang="de" class="sidepanel-document">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MQTT Live Monitor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup side-panel">
  <div class="popup-shell">
  <header class="popup-header">
    <div class="brand-row">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 13h3l2-7 4 14 3-10 2 3h4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <div>
        <h1>MQTT Live Monitor</h1>
        <div class="status-line">
          <span id="liveDot" class="dot muted"></span>
          <span id="statusText">Nicht verbunden</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <button id="openSidePanel" class="icon-btn" title="Rechts anheften">⇥</button>
      <span id="userAvatar" class="user-avatar" title="Benutzer">?</span>
    </div>
  </header>

  <main class="popup-main">
    <section id="viewTab" class="tab-panel active">
      <div class="section-toolbar">
        <h2>Schnellansicht</h2>
      </div>

      <main id="content" class="content">
        <div class="empty-state">
          <strong>Keine Schnellansicht eingerichtet</strong>
          <span>Wechsle zu Bearbeiten und fuege Entities hinzu.</span>
        </div>
      </main>
    </section>

    <section id="editTab" class="tab-panel">
      <div class="section-toolbar">
        <h2>Bearbeiten</h2>
        <button id="addItemBtn" class="icon-btn" title="Entity hinzufuegen">+</button>
      </div>

      <div id="pickerPanel" class="picker-panel hidden">
        <input id="entitySearch" placeholder="Entity suchen...">
        <div id="entityResults" class="entity-results"></div>
      </div>

      <div id="selectedItems" class="selected-list popup-selected edit-list"></div>
    </section>

    <section id="settingsTab" class="tab-panel">
      <div class="settings-stack">
        <section class="mini-panel">
          <h2>Verbindung</h2>
          <label>
            Server-URL
            <input id="serverUrl" type="url" placeholder="https://mqtt.example.de">
          </label>
          <label>
            Benutzername
            <input id="username" autocomplete="username">
          </label>
          <label>
            Passwort
            <input id="password" type="password" autocomplete="current-password">
          </label>
          <div class="button-row">
            <button id="loginBtn" class="primary">Verbinden</button>
            <button id="reloadBtn">Neu laden</button>
          </div>
        </section>

        <section class="mini-panel">
          <h2>Layout</h2>
          <div class="segmented fill">
            <button data-layout="compact" class="active">Kompakt</button>
            <button data-layout="list">Liste</button>
            <button data-layout="tiles">Kacheln</button>
          </div>
        </section>

      </div>
    </section>
  </main>

  <footer class="popup-footer">
    <button class="tab-btn active" data-tab="viewTab">Ansicht</button>
    <button class="tab-btn" data-tab="editTab">Bearbeiten</button>
    <button class="tab-btn" data-tab="settingsTab">Einstellungen</button>
  </footer>
  <span id="versionBadge" class="version-badge popup-version"></span>

  </div>

  <script src="vendor/socket.io.min.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
